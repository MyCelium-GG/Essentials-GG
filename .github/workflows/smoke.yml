name: smoke

# Starts the mod on every loader: a dev server, plus a dev client (on a
# virtual display) that joins it and stays connected. Catches what unit tests
# cannot: crashes at start-up, broken registration, players kicked on join.
# The shared action lives in MyCel-Lib (.github/actions/mod-smoke).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all-lines:
        description: Test every Minecraft line, not just the default
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
      all-lines:
        type: boolean
        default: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge]
        # Pushes test the default line; releases and manual runs test them all.
        mc: ${{ inputs.all-lines && fromJSON('["", "26.2", "26.1"]') || fromJSON('[""]') }}
    name: smoke ${{ matrix.loader }} ${{ matrix.mc || 'default' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Start a dev server and join it with a dev client
        uses: MyCelium-GG/MyCel-Lib/.github/actions/mod-smoke@v1
        with:
          loader: ${{ matrix.loader }}
          mc: ${{ matrix.mc }}
          mod-id: essentialsgg
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.loader }}-${{ matrix.mc || 'default' }}
          path: build/smoke/${{ matrix.loader }}
