# Minecraft 26.1.x build: ./gradlew build -Pmc=26.1
# Overrides gradle.properties (which holds the default, 26.3); Mycel comes
# from its <version>-26.1 JitPack tag (see settings.gradle). Built against
# 26.1.2, the only 26.1 patch with a stable NeoForge; the jar loads on 26.1,
# 26.1.1 and 26.1.2. Version-specific code (if any) lives in common/src/mc/26.1/java.
minecraft_version=26.1.2
minecraft_line=26.1
# Game versions the jar is published for.
minecraft_versions=26.1 26.1.1 26.1.2
minecraft_version_range=[26.1,26.2)
neo_form_version=26.1.2-1
fabric_version=0.155.3+26.1.2
forge_version=26.1.2-64.1.5
forge_loader_version_range=[62,)
neoforge_version=26.1.2.124
