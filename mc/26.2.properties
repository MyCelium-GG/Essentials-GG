# Minecraft 26.2 build: ./gradlew build -Pmc=26.2. Each file is one
# Minecraft line, named by minecraft_line.
# Overrides gradle.properties (which holds the default, 26.3); Mycel comes
# from its <version>-26.2 JitPack tag (see settings.gradle). Version-specific
# code (if any) lives in common/src/mc/26.2/java.
minecraft_version=26.2
minecraft_line=26.2
minecraft_version_range=[26.2,26.3)
neo_form_version=26.2-2
fabric_version=0.161.0+26.2
forge_version=26.2-65.1.5
forge_loader_version_range=[65,)
neoforge_version=26.2.0.93
